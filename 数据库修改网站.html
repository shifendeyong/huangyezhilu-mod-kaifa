    <style>*{scrollbar-width:thin;scrollbar-color:#4b5563 #1e1e1e}::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:#1e1e1e;border-radius:4px}::-webkit-scrollbar-thumb{background:#4b5563;border-radius:4px}body{background:#121212;color:#e5e5e5;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}.card{background:#1e1e1e;border-radius:1rem;border:1px solid #2d2d2d;box-shadow:0 8px 20px rgba(0,0,0,0.3);transition:transform .2s,box-shadow .2s;margin-bottom:1.5rem;overflow:hidden}.card:hover{transform:translateY(-2px);border-color:#3b82f6}.custom-input{width:100%;padding:.75rem 1rem;background-color:#0f0f0f;border:1px solid #333;border-radius:.75rem;outline:none;transition:all .2s;font-size:1rem;color:#f0f0f0}.custom-input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,0.2);background-color:#1a1a1a}.file-upload-wrapper{position:relative;width:100%;min-height:120px;border:2px dashed #374151;border-radius:1rem;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;background-color:#0f0f1a;padding:1rem;text-align:center}.file-upload-wrapper:hover{border-color:#3b82f6;background-color:#1e293b}.btn-primary{background:linear-gradient(105deg,#2563eb,#1d4ed8);box-shadow:0 4px 12px rgba(37,99,235,0.3)}.btn-primary:hover{background:linear-gradient(105deg,#3b82f6,#2563eb)}.btn-success{background:linear-gradient(105deg,#059669,#047857)}.btn-success:hover{background:linear-gradient(105deg,#10b981,#059669)}.btn-secondary{background:#2d2d2d;color:#e5e5e5}.btn-secondary:hover{background:#3d3d3d}.btn-warning{background:#b45309;color:white}.btn-warning:hover{background:#ea580c}.fade-in{animation:fadeInUp .2s cubic-bezier(0.2,0.9,0.4,1.1)}@keyframes fadeInUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}.result-card{animation:fadeSlide .15s ease-out}@keyframes fadeSlide{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}.badge-version{background:rgba(59,130,246,0.2);backdrop-filter:blur(2px);border:1px solid rgba(59,130,246,0.4)}.tab-btn{transition:all .2s;cursor:pointer}.tab-active{border-bottom:3px solid #3b82f6;color:#60a5fa;background:#1e1e2e}.toast{visibility:hidden;min-width:200px;background:#1e293b;color:#fff;text-align:center;border-radius:20px;padding:10px 16px;position:fixed;z-index:60;left:50%;bottom:30px;transform:translateX(-50%);opacity:0;transition:opacity .2s,bottom .2s;font-size:.85rem;box-shadow:0 10px 25px -5px rgba(0,0,0,0.2);pointer-events:none}.toast.show{visibility:visible;opacity:1;bottom:45px}.toast.success{background:#0f3b2c;border-left:5px solid #10b981}.toast.error{background:#4c1d1d;border-left:5px solid #f87171}.toast.info{background:#1e3a5f;border-left:5px solid #3b82f6}.file-card{background:#0f0f0f;border-radius:1rem;border:1px solid #2d2d2d;transition:all .1s}.file-card:hover{background:#1a1a1a;border-color:#3b82f6}.hidden{display:none!important}</style>

<body>
    <header class="bg-gradient-to-r from-slate-900 via-gray-900 to-indigo-900 border-b border-indigo-500/30 sticky top-0 z-50 shadow-2xl backdrop-blur-sm">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2"><i class="fa-solid fa-cubes text-indigo-400 text-xl"></i><div><h1 class="text-lg font-bold bg-gradient-to-r from-blue-400 to-indigo-300 bg-clip-text text-transparent">勇哥牌·三合一工坊</h1><p class="text-[10px] text-gray-400 hidden sm:block">GUID · 随机数 · 批量XML替换</p></div></div>
            <div class="badge-version text-[10px] px-2 py-1 rounded-full text-indigo-300 font-mono">v7.0 · 独立GUID</div>
        </div>
    </header>
    <main class="max-w-6xl mx-auto p-3 mt-2">
        <div class="flex flex-wrap gap-3 mb-4 border-b border-indigo-800/50 pb-1">
            <button id="tabGuidBtn" class="tab-btn px-4 py-1.5 rounded-t-lg text-sm font-semibold bg-transparent text-gray-300 border-b-2 border-transparent">🔖 GUID</button>

        </div>
        <div id="guidPanel" class="tab-panel fade-in">
            <div class="card p-4"><div class="flex flex-col sm:flex-row gap-4 items-end sm:items-center justify-between"><div class="w-full sm:w-auto flex-grow max-w-sm"><label class="block text-sm font-bold text-gray-300 mb-1">GUID生成数量</label><input type="number" id="guidCount" min="1" placeholder="例: 30" class="custom-input"></div><button id="genGuidBtn" class="btn-primary text-white font-bold py-2 px-6 rounded-xl flex items-center justify-center gap-2">✨ 生成GUID</button></div></div>
            <div class="card p-4"><div class="flex justify-between items-center flex-wrap gap-2 mb-3"><div class="flex items-center gap-2"><i class="fa-solid fa-fingerprint text-indigo-400"></i><span class="font-bold text-gray-300 text-sm">GUID结果列表</span></div><div class="flex items-center gap-2"><span id="guidResultCount" class="text-xs bg-indigo-900/40 px-2 py-1 rounded-full font-mono text-indigo-300">📌 0条</span><button id="batchCopyGuidBtn" class="btn-secondary text-xs font-semibold px-3 py-1 rounded-lg disabled:opacity-40">📋 全部复制</button></div></div><div id="guidListContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 min-h-[200px]"><div id="guidEmptyState" class="col-span-full py-10 flex flex-col items-center text-gray-500 border-2 border-dashed border-gray-700 rounded-2xl bg-gray-900/40"><i class="fa-regular fa-gem text-3xl mb-2 opacity-50"></i><p class="text-sm">暂无GUID</p></div></div></div>
        </div>
        <div id="randomPanel" class="tab-panel hidden fade-in">
            <div class="card p-4"><div class="grid grid-cols-1 sm:grid-cols-3 gap-4 items-end"><div><label class="block text-sm font-bold text-gray-300 mb-1">最小值</label><input type="number" id="randMin" value="1" min="0" class="custom-input"></div><div><label class="block text-sm font-bold text-gray-300 mb-1">最大值</label><input type="number" id="randMax" value="100" min="1" class="custom-input"></div><div><label class="block text-sm font-bold text-gray-300 mb-1">生成数量</label><input type="number" id="randCount" min="1" value="10" class="custom-input"></div></div><div class="flex justify-end mt-4"><button id="genRandomBtn" class="btn-success text-white font-bold py-2 px-6 rounded-xl flex items-center gap-2">🎲 生成</button></div><p class="text-[11px] text-gray-500 mt-2">范围不足时允许重复</p></div>
            <div class="card p-4"><div class="flex justify-between items-center flex-wrap gap-2 mb-3"><div class="flex items-center gap-2"><i class="fa-solid fa-dice-d6 text-emerald-400"></i><span class="font-bold text-gray-300 text-sm">随机数列表</span></div><div class="flex items-center gap-2"><span id="randomResultCount" class="text-xs bg-emerald-900/40 px-2 py-1 rounded-full font-mono text-emerald-300">🎯 0条</span><button id="batchCopyRandomBtn" class="btn-secondary text-xs font-semibold px-3 py-1 rounded-lg disabled:opacity-40">📋 全部复制</button></div></div><div id="randomListContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 min-h-[200px]"><div id="randomEmptyState" class="col-span-full py-10 flex flex-col items-center text-gray-500 border-2 border-dashed border-gray-700 rounded-2xl bg-gray-900/40"><i class="fa-regular fa-clock text-3xl mb-2 opacity-50"></i><p class="text-sm">暂无随机数</p></div></div></div>
        </div>
        <div id="replacePanel" class="tab-panel hidden fade-in">
            <div class="card p-4">
                <div class="file-upload-wrapper" id="multiDropZone"><i class="fa-solid fa-cloud-upload-alt text-3xl text-indigo-400/60 mb-2"></i><p class="text-xs text-gray-400">点击或拖拽批量上传 (.xml/.txt) | 支持多文件</p><input type="file" id="multiFileInput" accept=".txt,.xml,.XML,.TXT" multiple style="display:none;"></div>
                <div class="flex flex-wrap gap-2 mt-4 justify-between items-center">
                    <div class="flex gap-2 flex-wrap"><button id="batchReplaceAllBtn" class="btn-primary text-white text-sm px-4 py-1.5 rounded-lg disabled:opacity-50"><i class="fa-solid fa-arrows-rotate"></i> 全部替换GUID</button><button id="batchCopyAllBtn" class="btn-success text-white text-sm px-4 py-1.5 rounded-lg disabled:opacity-50"><i class="fa-regular fa-copy"></i> 全部复制结果</button><button id="batchDownloadAllBtn" class="btn-secondary text-sm px-4 py-1.5 rounded-lg disabled:opacity-50"><i class="fa-solid fa-download"></i> 批量下载</button></div>
                    <button id="clearAllFilesBtn" class="btn-warning text-sm px-4 py-1.5 rounded-lg"><i class="fa-regular fa-trash-can"></i> 清空所有</button>
                </div>
            </div>
            <div id="fileListContainer" class="space-y-3 min-h-[260px]"><div id="noFilePlaceholder" class="card p-8 text-center text-gray-400 border-dashed"><i class="fa-regular fa-folder-open text-4xl mb-2 opacity-40"></i><p>暂无文件，请上传XML/TXT文件</p></div></div>
        </div>
    </main>
    <footer class="text-center text-gray-500 text-[10px] py-4 border-t border-gray-800 mt-4"><i class="fa-regular fa-shield-heart text-indigo-500"></i> 本地处理 · 数据不上传 · 每个GUID独立生成 · 一键复制结果</footer>
    <div id="globalToast" class="toast"></div>
    <script>
        (function(){const $=(s,c)=>(c||document).querySelector(s),$$=(s,c)=>[...((c||document).querySelectorAll(s))];const toast=(m,t='success')=>{const e=$('#globalToast');e.textContent=m;e.className='toast show '+t;clearTimeout(e._timer);e._timer=setTimeout(()=>{e.className=e.className.replace('show','')},2600)};const confetti=()=>{if(window.innerWidth<700)return;window.confetti({particleCount:80,spread:55,origin:{y:0.6},startVelocity:12,decay:0.9,colors:['#3b82f6','#10b981','#f59e0b']})};let activeRender=null;const chunkRender=(container,items,cardCreator,batchSize=80,delayMs=12)=>{return new Promise((resolve)=>{if(activeRender&&typeof activeRender.cancel==='function')activeRender.cancel();let idx=0,total=items.length,frag=document.createDocumentFragment(),canceled=false;const cancelFn=()=>{canceled=true};const batch=()=>{if(canceled){resolve(false);return}const end=Math.min(idx+batchSize,total);for(let i=idx;i<end;i++)frag.appendChild(cardCreator(items[i]));idx=end;if(idx>=total){container.innerHTML='';container.appendChild(frag);resolve(true)}else setTimeout(batch,delayMs)};batch();activeRender={cancel:cancelFn}}).finally(()=>{if(activeRender&&activeRender.cancel===arguments.callee?.cancel)activeRender=null})};const setTab=(t)=>{['guidPanel','randomPanel','replacePanel'].forEach(id=>$('#'+id).classList.add('hidden'));['tabGuidBtn','tabRandomBtn','tabReplaceBtn'].forEach(id=>$('#'+id).classList.remove('tab-active'));if(t==='guid'){$('#guidPanel').classList.remove('hidden');$('#tabGuidBtn').classList.add('tab-active')}else if(t==='random'){$('#randomPanel').classList.remove('hidden');$('#tabRandomBtn').classList.add('tab-active')}else{$('#replacePanel').classList.remove('hidden');$('#tabReplaceBtn').classList.add('tab-active')}};$('#tabGuidBtn').onclick=()=>setTab('guid');$('#tabRandomBtn').onclick=()=>setTab('random');$('#tabReplaceBtn').onclick=()=>setTab('replace');setTab('guid');const guidRe=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;const isValidGuid=g=>typeof g==='string'&&guidRe.test(g);const genOne=()=>{if(crypto.randomUUID)return crypto.randomUUID().toLowerCase();return'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0,v=c==='x'?r:(r&0x3|0x8);return v.toString(16)})};const genUniq=n=>{const s=new Set();while(s.size<n)s.add(genOne());return[...s]};let guids=[];const gCnt=$('#guidCount'),gBtn=$('#genGuidBtn'),gList=$('#guidListContainer'),gEmpty=$('#guidEmptyState'),gRes=$('#guidResultCount'),gCopy=$('#batchCopyGuidBtn');const mkGuidCard=g=>{const d=document.createElement('div');d.className='result-card bg-gray-900/80 p-3 rounded-xl border border-indigo-800 hover:border-indigo-500 shadow-md flex justify-between items-center gap-2';const c=document.createElement('code');c.className='font-mono text-xs text-gray-200 break-all bg-black/40 px-2 py-1 rounded-md flex-1';c.textContent=g;const b=document.createElement('button');b.className='p-1.5 rounded-lg text-gray-400 hover:text-indigo-400 hover:bg-indigo-900/30';b.innerHTML='<i class="fa-regular fa-copy"></i>';b.onclick=async()=>{try{await navigator.clipboard.writeText(g);toast('GUID已复制','success');b.innerHTML='<i class="fa-solid fa-check text-green-500"></i>';setTimeout(()=>{b.innerHTML='<i class="fa-regular fa-copy"></i>'},800)}catch(e){toast('复制失败','error')}};d.appendChild(c);d.appendChild(b);return d};const renderGuids=async arr=>{gRes.innerText='📌 '+arr.length+'条';if(!arr.length){gList.innerHTML='';gList.appendChild(gEmpty);gCopy.disabled=true;return}gEmpty.style.display='none';gCopy.disabled=false;gList.innerHTML='';await chunkRender(gList,arr,mkGuidCard,90,8);if(arr.length>0&&arr.length<800)confetti()};const copyAllGuids=async()=>{if(!guids.length){toast('无GUID','error');return}try{await navigator.clipboard.writeText(guids.join('\n'));toast('已复制 '+guids.length+' 条','success')}catch(e){toast('复制失败','error')}};const onGenGuid=async()=>{let cnt=parseInt(gCnt.value,10);if(isNaN(cnt)||cnt<1){toast('输入正整数','error');return}if(cnt>50000&&!confirm('生成'+cnt+'个GUID可能耗时，继续？'))return;toast('正在生成'+cnt+'个GUID...','info');gBtn.disabled=true;setTimeout(async()=>{try{const items=genUniq(cnt);guids=items;await renderGuids(items);toast('成功生成'+items.length+'个','success')}catch(e){toast('生成失败','error')}finally{gBtn.disabled=false}},20)};gBtn.onclick=onGenGuid;gCopy.onclick=copyAllGuids;gCnt.addEventListener('keypress',e=>{if(e.key==='Enter')onGenGuid()});gList.innerHTML='';gList.appendChild(gEmpty);gCopy.disabled=true;let rands=[];const rMin=$('#randMin'),rMax=$('#randMax'),rCnt=$('#randCount'),rBtn=$('#genRandomBtn'),rList=$('#randomListContainer'),rEmpty=$('#randomEmptyState'),rRes=$('#randomResultCount'),rCopy=$('#batchCopyRandomBtn');const genRands=(minv,maxv,count)=>{if(minv>maxv)throw'min>max';const range=maxv-minv+1,res=[];for(let i=0;i<count;i++)res.push(Math.floor(Math.random()*range)+minv);return res};const mkRandCard=n=>{const d=document.createElement('div');d.className='result-card bg-gray-900/80 p-3 rounded-xl border border-emerald-800 hover:border-emerald-500 shadow-md flex justify-between items-center';const s=document.createElement('span');s.className='font-mono text-lg font-bold text-emerald-400 bg-black/40 px-3 py-1 rounded-lg';s.textContent=n;const b=document.createElement('button');b.className='p-1.5 rounded-lg text-gray-400 hover:text-emerald-400 hover:bg-emerald-900/30';b.innerHTML='<i class="fa-regular fa-copy"></i>';b.onclick=async()=>{try{await navigator.clipboard.writeText(n.toString());toast('已复制 '+n,'success');b.innerHTML='<i class="fa-solid fa-check text-green-500"></i>';setTimeout(()=>{b.innerHTML='<i class="fa-regular fa-copy"></i>'},800)}catch(e){toast('复制失败','error')}};d.appendChild(s);d.appendChild(b);return d};const renderRands=async arr=>{rRes.innerText='🎯 '+arr.length+'条';if(!arr.length){rList.innerHTML='';rList.appendChild(rEmpty);rCopy.disabled=true;return}rEmpty.style.display='none';rCopy.disabled=false;rList.innerHTML='';await chunkRender(rList,arr,mkRandCard,100,8);if(arr.length>0&&arr.length<1000)confetti()};const copyAllRands=async()=>{if(!rands.length){toast('无随机数','error');return}try{await navigator.clipboard.writeText(rands.join('\n'));toast('已复制 '+rands.length+' 个','success')}catch(e){toast('复制失败','error')}};const onGenRand=async()=>{let min=parseInt(rMin.value,10),max=parseInt(rMax.value,10),cnt=parseInt(rCnt.value,10);if(isNaN(min)||isNaN(max)||isNaN(cnt)){toast('请填完整','error');return}if(min>max){[min,max]=[max,min];rMin.value=min;rMax.value=max;toast('已交换范围','warning')}if(cnt<=0){toast('数量≥1','error');return}const range=max-min+1;if(range<cnt&&!confirm('范围['+min+','+max+']只有'+range+'个不同数，生成'+cnt+'个将重复，继续？'))return;toast('生成'+cnt+'个随机数...','info');rBtn.disabled=true;setTimeout(()=>{try{const nums=genRands(min,max,cnt);rands=nums;renderRands(nums).then(()=>toast('已生成'+nums.length+'个','success')).catch(()=>toast('渲染失败','error'))}catch(e){toast('生成失败','error')}finally{rBtn.disabled=false}},10)};rBtn.onclick=onGenRand;rCopy.onclick=copyAllRands;rList.innerHTML='';rList.appendChild(rEmpty);rCopy.disabled=true;const targetTags=['MemberComponentTemplate','Parameter','ParameterSet','ComponentTemplate','MemberSubsystemTemplate','EntityTemplate'];const parseXmlAndCollect=str=>{const parser=new DOMParser(),doc=parser.parseFromString(str,'application/xml');if(doc.querySelector('parsererror'))throw new Error('XML格式错误');let set=new Set(),elemCount=0;for(const tag of targetTags){const nodes=doc.getElementsByTagName(tag);for(let i=0;i<nodes.length;i++){const el=nodes[i];elemCount++;const g=el.getAttribute('Guid');if(g&&isValidGuid(g))set.add(g)}}return{doc,set,elemCount}};const applyReplaceIndependent=(doc)=>{const nd=doc.cloneNode(true);for(const tag of targetTags){const nodes=nd.getElementsByTagName(tag);for(let i=0;i<nodes.length;i++){const el=nodes[i];if(el.hasAttribute('Guid')){el.setAttribute('Guid',genOne())}}}return nd};const serialize=doc=>new XMLSerializer().serializeToString(doc);let fileItems=[],nextId=1;c
